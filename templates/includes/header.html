{% load static %}

<header class="header">
    <div class="header__container">

        <a href="{% url 'home' %}" class="header__logo">
            <img src="{% static 'images/Logo_s.svg' %}" alt="Olimpox" class="logo">
            <span class="header__logo-version">
                2.0
            </span>
        </a>

        <div class="header__center">

            <nav class="header__menu">
                <a href="{% url 'home' %}" class="header__link active">
                    Главная
                </a>

                <a href="#" class="header__link">
                    Все вопросы
                </a>
            </nav>

            <form class="header__search" action="#" method="get">
                <input
                    type="text"
                    name="q"
                    placeholder="Введите текст вопроса..."
                    autocomplete="off"
                >

                <button type="submit" class="header__search-button">
                    <i class="bi bi-search"></i>
                </button>
            </form>

        </div>

        <div class="header__profile-wrapper">

            <a href="#" class="header__profile" id="profileButton">
                {% if user.photo %}
                    <img src="{{ user.photo.url }}" alt="{{ user.full_name }}" class="header__profile-image">
                {% else %}
                    <i class="bi bi-person-circle header__profile-icon"></i>
                {% endif %}
            </a>

            <div class="user-menu" id="userMenu">

                <div class="user-menu__name">
                    {{ user.full_name|default:user.username }}
                </div>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="user-menu__logout">
                        Выйти
                    </button>
                </form>

            </div>

        </div>

    </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const button = document.getElementById('profileButton');
    const menu = document.getElementById('userMenu');

    if (!button || !menu) return;

    button.addEventListener('click', (e) => {
        e.preventDefault();
        menu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && !button.contains(e.target)) {
            menu.classList.remove('active');
        }
    });

});
</script>
